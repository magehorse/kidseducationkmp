apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'


android {
    compileSdk 36
    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false // shrinking happens once, in the host :app module
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        // Needed so AdManager can check BuildConfig.DEBUG and use Google's
        // test ad unit on debug builds.
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'com.harvitech.kidsdrawing'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Explicit (rather than relying on appcompat's transitive version) so
    // DefaultLifecycleObserver in AdManager always resolves.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    // For enableEdgeToEdge() / OnBackPressedCallback (replaces deprecated
    // Window.setStatusBarColor and the deprecated onBackPressed() override).
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'


    //Ads
    implementation 'com.google.android.gms:play-services-ads:25.1.0' // pinned to match :app - 25.5.0's Kotlin metadata needs Kotlin 2.3.0, this project is on 2.1.0

    //Image Processing
    implementation 'com.github.bumptech.glide:glide:4.14.2'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.github.QuadFlask:colorpicker:0.0.13'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}